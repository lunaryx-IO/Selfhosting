[global]
    workgroup = WERKSTATT
    server role = standalone server
    security = user
    passdb backend = tdbsam
    private dir = /var/lib/samba/private
    state directory = /var/lib/samba
    map to guest = Never
    server min protocol = SMB3_00
    server signing = mandatory
    server smb encrypt = required
    smb ports = 445
    disable netbios = yes
    load printers = no
    disable spoolss = yes
    usershare max shares = 0
    logging = file
    log file = /var/log/samba/log.%I
    max log size = 1000

[werkstatt]
    path = /srv/werkdateien-probe
    browseable = yes
    guest ok = no
    valid users = @werkdateien
    read only = no
    create mask = 0660
    directory mask = 2770
    inherit acls = yes
    nt acl support = no
    follow symlinks = no
    csc policy = disable
