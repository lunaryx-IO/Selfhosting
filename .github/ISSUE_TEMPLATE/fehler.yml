name: Fehler in Buch oder Beilage
description: Eine konkrete Abweichung mit Fundstelle melden.
title: "[Fehler] "
body:
  - type: input
    id: fundstelle
    attributes:
      label: Band, Kapitel, Abschnitt oder Datei
    validations:
      required: true
  - type: input
    id: fassung
    attributes:
      label: Buch- und Materialfassung
    validations:
      required: true
  - type: textarea
    id: vergleich
    attributes:
      label: Erwartetes und beobachtetes Ergebnis
      description: Nur bereinigte Ausschnitte teilen. Keine Passwörter, Tokens, private Schlüssel oder Kundendaten.
    validations:
      required: true
  - type: textarea
    id: umgebung
    attributes:
      label: Relevanter Aufbau und Softwarestand
      description: Nur die für den Fehler wichtigen Angaben; keine vertraulichen Netzwerk- oder Kontodaten.
